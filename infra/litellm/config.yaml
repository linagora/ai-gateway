# LiteLLM Proxy — configuration (édition communautaire)
# Les modèles sont gérés depuis l'UI admin (STORE_MODEL_IN_DB=True) : pas de redéploiement
# pour ajouter un modèle ou changer un tarif. Ce fichier ne porte que les réglages globaux.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Ne jamais stocker le contenu des prompts/réponses dans les logs de dépense (RGPD)
  store_prompts_in_spend_logs: false
  # Détail par requête conservé 90 jours ; les tables agrégées Daily* gardent l'historique
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_cleanup_cron: "0 3 * * *"
  # Cache des clés valides, par processus : une clé révoquée passait encore 10 à 30 s (critère 7).
  # 5 s borne ce délai ; coût : une lecture en base par clé active toutes les 5 s et par processus.
  user_api_key_cache_ttl: 5

litellm_settings:
  drop_params: true
  # Garde de la passerelle (garde.py, à côté de ce fichier) : refus des paramètres qui changeraient
  # de modèle ou de fournisseur
  callbacks: garde.garde
  # JEV (Typesafe, niveau Expérimental) : fournisseur personnalisé (jev.py), modèle
  # « typesafe/jev-latest ». Pas de route dédiée : dans l'édition communautaire, une clé ne peut pas
  # ouvrir une route « pass-through » (allowed_passthrough_routes est réservé à l'édition Enterprise).
  custom_provider_map:
    - {"provider": "typesafe", "custom_handler": jev.jev}
  # --- Phase 2 : Langfuse ------------------------------------------------------
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # turn_off_message_logging: true     # métadonnées seulement, tant que la politique RGPD n'est pas validée
  # (variables LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST à ajouter au service litellm)

# Modèles OpenRouter : uniquement ceux de liste-blanche-openrouter.yaml, déclarés par
# scripts/sync-openrouter.py (jamais à la main ni par l'UI, jamais de joker « openrouter/* »).
# Autres modèles : déclarés en base par l'API, par exemple le modèle N3 :
# model_list:
#   - model_name: qwen3.8                  # N3 — endpoint OVHcloud (déclaré en base le 2026-09-24)
#     litellm_params:
#       model: ovhcloud/Qwen3.8-27B       # pas openai/… : /v1/messages passerait par l'API Responses, refusée par OVH
#       api_base: os.environ/OVH_QWEN_API_BASE    # https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
#       api_key: os.environ/OVH_QWEN_API_KEY
#       input_cost_per_token: 0.0000004           # 0,40 € HT / Mtoken (tarif public OVH, validé le 2026-09-24)
#       output_cost_per_token: 0.0000027          # 2,70 € HT / Mtoken
#     model_info:
#       pricing_currency: EUR
#       data_level: N3
#       hosting: INTERNE_OVH
