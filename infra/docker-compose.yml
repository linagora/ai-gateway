# Passerelle IA Linagora — /opt/linagora-ia/docker-compose.yml
# Seul Caddy publie des ports (80/443). Tout le reste est sur le réseau interne.
# Rappel : les ports publiés par Docker contournent ufw — ne JAMAIS ajouter de "ports:" ailleurs.
#
# Démarrage phase 1 : docker compose up -d
# Avec le portail (jalon J3) : docker compose --profile portal up -d

name: linagora-ia

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: ${CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN_PORTAL: ${DOMAIN_PORTAL}
      DOMAIN_API: ${DOMAIN_API}
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS}
      LANGFUSE_UPSTREAM: ${LANGFUSE_UPSTREAM:-}
    volumes:
      # Dossier entier : le Caddyfile importe portal-gate.caddy (et un rsync remplace les fichiers).
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - litellm
    mem_limit: 256m
    logging: *default-logging

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      REPORTING_RO_PASSWORD: ${REPORTING_RO_PASSWORD}
    volumes:
      # PostgreSQL 18 : les données vont sous /var/lib/postgresql/18/docker, et le volume se monte sur /var/lib/postgresql.
      # Le volume pg_data de PostgreSQL 16 reste sur l'hôte après la migration (scripts/migrer-postgres.sh), pour un
      # retour arrière, jusqu'à sa suppression.
      - pg_data_18:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256m
    mem_limit: 2g
    logging: *default-logging

  litellm:
    image: ${LITELLM_IMAGE}
    restart: unless-stopped
    command: ["--config", "/app/passerelle/config.yaml", "--port", "4000", "--num_workers", "2"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      # Tout LiteLLM (UI + API) est servi sous /admin ; Caddy préfixe /admin pour ai-api.
      SERVER_ROOT_PATH: /admin
      PROXY_BASE_URL: https://${DOMAIN_PORTAL}
      # Compte admin local de la console. Pas de SSO LiteLLM : sa limite gratuite (5 utilisateurs)
      # compte tous les utilisateurs inscrits, et le portail inscrit chaque salarié. L'accès à /admin
      # passe par le point de contrôle du portail (caddy/portal-gate.caddy).
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OVH_QWEN_API_BASE: ${OVH_QWEN_API_BASE}
      OVH_QWEN_API_KEY: ${OVH_QWEN_API_KEY}
      NOX_API_BASE: ${NOX_API_BASE}
      NOX_API_KEY: ${NOX_API_KEY}
    volumes:
      # config.yaml, garde.py (chargée depuis le dossier de la configuration) et liste blanche OpenRouter
      - ./litellm:/app/passerelle:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/admin/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 3g
    logging: *default-logging

  # Valkey (fork libre de Redis, licence BSD) : Redis ≥ 7.4 n'est plus sous licence libre.
  # Le service garde le nom "redis" : c'est le nom d'hôte attendu par Superset (REDIS_HOST).
  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 384m
    logging: *default-logging

  superset:
    build:
      context: ./superset
      args:
        SUPERSET_BASE_IMAGE: ${SUPERSET_BASE_IMAGE}
    image: linagora-ia/superset:local
    restart: unless-stopped
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_APP_ROOT: /stats
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD}@postgres:5432/superset
      REDIS_HOST: redis
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 2g
    logging: *default-logging

  portal:
    profiles: ["portal"]
    build:
      context: ./portal
    image: linagora-ia/portal:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://portal:${PORTAL_DB_PASSWORD}@postgres:5432/portal
      LITELLM_BASE_URL: http://litellm:4000/admin
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PUBLIC_API_BASE_URL: https://${DOMAIN_API}/v1
      AUTH_URL: https://${DOMAIN_PORTAL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      PORTAL_ADMIN_UIDS: ${PORTAL_ADMIN_UIDS}
      PORTAL_REPORTING_UIDS: ${PORTAL_REPORTING_UIDS:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS}
      PORTAL_TASK_TOKEN: ${PORTAL_TASK_TOKEN:-}
      # Supervision des modèles, planifiée dans le portail : intervalle en minutes ; 0 la désactive.
      SUPERVISION_INTERVAL_MINUTES: ${SUPERVISION_INTERVAL_MINUTES:-10}
      # Destinataire (aud) exigé des jetons d'intégration de l'API /api/v1.
      INTEGRATION_TOKEN_AUDIENCE: ${INTEGRATION_TOKEN_AUDIENCE:-ai-gateway}
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    mem_limit: 768m
    logging: *default-logging

  # Migrations Prisma du portail, lancées à la demande (la CLI n'est pas dans l'image d'exécution) :
  #   docker compose --profile portal run --rm portal-migrate
  portal-migrate:
    profiles: ["portal"]
    build:
      context: ./portal
      target: migrate
    image: linagora-ia/portal-migrate:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://portal:${PORTAL_DB_PASSWORD}@postgres:5432/portal
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  pg_data_18:
  caddy_data:
  caddy_config:
