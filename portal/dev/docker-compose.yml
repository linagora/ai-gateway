# Environnement de développement du portail : Postgres + LiteLLM, aux mêmes versions (digest) que la
# production. Clés et mots de passe FACTICES, propres au poste : n'y mettre aucun secret réel.
# Ports publiés sur 127.0.0.1 uniquement.
#   docker compose -f dev/docker-compose.yml up -d
#   LiteLLM : http://127.0.0.1:54400/admin (préfixe /admin comme en production)
#   Postgres : 127.0.0.1:55432 (bases litellm, portal, portal_test)
#   OIDC simulé : http://127.0.0.1:54500/default (remplace LemonLDAP::NG ; connexion interactive :
#     saisir l'uid comme « user », et les claims {"email": "...", "name": "..."})
#   Mailpit : SMTP 127.0.0.1:54525, courriels reçus sur http://127.0.0.1:54825 (interface et API)
name: portail-dev

services:
  # Faux serveur de courriel : reçoit tous les courriels du portail de développement, sans rien envoyer.
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - "127.0.0.1:54525:1025"
      - "127.0.0.1:54825:8025"

  # Point de contrôle /admin et /stats, avec le même fragment que la production
  caddy:
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../infra/caddy/portal-gate.caddy:/etc/caddy/portal-gate.caddy:ro
    ports:
      - "127.0.0.1:54600:8080"

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    ports:
      - "127.0.0.1:54500:8080"

  postgres:
    image: postgres:16.15@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: sk-dev-master-key
      LITELLM_SALT_KEY: sk-dev-salt-key
      SERVER_ROOT_PATH: /admin
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:54400:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/admin/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pg_dev:
